apiVersion: v1
kind: ConfigMap
metadata:
  name: mergeguard-config
  namespace: mergeguard-ai
data:
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "mergeguard_db"
---
apiVersion: v1
kind: Secret
metadata:
  name: mergeguard-secret
  namespace: mergeguard-ai
type: Opaque
stringData:
  DB_USER: "mergeguard"
  DB_PASSWORD: "mergeguard_k8s_password"
  DATABASE_URL: "postgresql://mergeguard:mergeguard_k8s_password@postgres-service:5432/mergeguard_db"
