apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: mergeguard-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mergeguard-backend
  template:
    metadata:
      labels:
        app: mergeguard-backend
    spec:
      containers:
        - name: backend
          image: mergeguard-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mergeguard-secret
                  key: DATABASE_URL
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "512Mi"
              cpu: "300m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: mergeguard-ai
spec:
  selector:
    app: mergeguard-backend
  ports:
    - port: 8000
      targetPort: 8000
