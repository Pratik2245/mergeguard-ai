apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mergeguard-ai.fullname" . }}-config
  labels:
    {{- include "mergeguard-ai.labels" . | nindent 4 }}
data:
  DB_HOST: "{{ include "mergeguard-ai.fullname" . }}-postgres"
  DB_PORT: "5432"
  DB_NAME: {{ .Values.postgresql.auth.database | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mergeguard-ai.fullname" . }}-secret
  labels:
    {{- include "mergeguard-ai.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_USER: {{ .Values.postgresql.auth.username | quote }}
  DB_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  DATABASE_URL: "postgresql://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ include "mergeguard-ai.fullname" . }}-postgres:5432/{{ .Values.postgresql.auth.database }}"
